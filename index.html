    <header class="rolling-characters rolling-through-lis no-hover-fx">
      <ul x-data="hoverlist({ rolling: true, rollingThroughLis: false })">

        <li class="work" data-list-name="work" :class="{'active': active == 'work'}" @click="activate('work')">WORK</li>
